# environment.yaml
#
# Conda environment for morphology_featurization_tools and the example
# notebooks: illumination correction, Cellpose segmentation, cp_measure
# features, the OpenPhenom autoencoder, TDAExplore persistence landscapes,
# normalization and copairs retrieval.
#
#   bash install.sh
#
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - scipy
  - scikit-image
  - pandas
  - pillow<12
  - matplotlib
  - jupyterlab
  # tdaexplore: alpha-complex persistence (gudhi) and image IO (imageio).
  # gudhi ships compiled CGAL/Eigen internals, so it comes from conda-forge
  # rather than pip; the wheel is not available for every platform.
  - gudhi>=3.5
  - imageio>=2.9
  - pytz
  - pip
  - pip:
    # PyTorch built for CUDA 12.1 (Linux). On other platforms, replace these
    # three lines with the PyTorch 2.5 install for that platform.
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.5.0+cu121
    - torchvision==0.20.0+cu121
    - transformers==4.40.0
    - cellpose>=4
    - joblib
    - copairs
    # jump-portrait and cp-measure are pinned to recent releases. Unpinned,
    # a conflict in the boto3 stack below makes pip fall back to old versions
    # of these, one of which requires a numpy source build that fails on
    # Python 3.12.
    - jump-portrait==0.1.1
    - cp-measure==0.1.19
    # jump-portrait -> s3fs -> aiobotocore -> botocore pins botocore tightly.
    # Fixing these three keeps pip from searching through many boto3
    # releases: boto3 1.41.5 requires botocore 1.41.5, inside aiobotocore
    # 2.26.0's botocore>=1.41.0,<1.41.6 range.
    - s3fs==2024.12.0
    - aiobotocore==2.26.0
    - boto3==1.41.5
    # Translates compound and gene identifiers to JCP2022 ids for the JUMP
    # datasets; downloads its database from Zenodo on first use.
    - broad-babel==0.1.31
    # The packages in this repository, installed in editable mode so that
    # changes to their sources take effect without reinstalling.
    #
    # openphenom holds no model code until install_openphenom.sh downloads it;
    # because the install is editable, that can happen before or after this
    # environment is created.
    #
    # tdaexplore uses a src/ layout. pip reads that from its pyproject.toml, so
    # the path here is the package root, not the src directory.
    - -e ./morphology_featurization_tools
    - -e ./openphenom
    - -e ./tdaexplore

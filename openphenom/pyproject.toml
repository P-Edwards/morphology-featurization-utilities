[project]
name = "openphenom"
version = "0.1.0"
requires-python = ">=3.10.4"
dependencies = [
    "huggingface-hub",
    "timm",
    "torchmetrics",
    "tqdm",
    "transformers",
    "zarr",
    "pytorch-lightning>=2.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"